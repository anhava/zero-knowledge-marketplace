version: '3.8'

services:
  # Tor hidden service for the shop
  tor-{{SHOP_ID}}:
    image: dperson/torproxy:latest
    container_name: tor-{{SHOP_ID}}
    restart: unless-stopped
    networks:
      - shop-{{SHOP_ID}}-network
    environment:
      - TORUSER={{SHOP_ID}}
      - TOR_SERVICE=1
      - TOR_SERVICE_NAME={{SHOP_ID}}
      - TOR_SERVICE_PORT=80
      - TOR_SERVICE_TARGET=nginx-{{SHOP_ID}}:80
    volumes:
      - tor-{{SHOP_ID}}-data:/var/lib/tor
      - ./tor/torrc-{{SHOP_ID}}:/etc/tor/torrc:ro

  # BTCPay Server instance for the shop
  btcpay-{{SHOP_ID}}:
    image: btcpayserver/btcpayserver:{{BTCPAY_VERSION}}
    container_name: btcpay-{{SHOP_ID}}
    restart: unless-stopped
    networks:
      - shop-{{SHOP_ID}}-network
    environment:
      BTCPAY_HOST: {{SHOP_ID}}.{{ONION_DOMAIN}}
      BTCPAY_PROTOCOL: http
      BTCPAY_PORT: 3003
      BTCPAY_BIND: 0.0.0.0
      BTCPAY_ROOTPATH: /
      BTCPAY_POSTGRES: User ID=btcpay;Password={{DB_PASSWORD}};Host=postgres-{{SHOP_ID}};Port=5432;Database=btcpayserver;
      BTCPAY_DEBUGLOG: btcpay.log
      BTCPAY_CHAINS: {{CRYPTO_CHAINS}}
      BTCPAY_{{PRIMARY_CRYPTO}}_EXPLORERURL: http://nbxplorer-{{SHOP_ID}}:32838/
      BTCPAY_BTCLIGHTNING: type={{LIGHTNING_TYPE}}
      BTCPAY_SOCKSENDPOINT: tor-{{SHOP_ID}}:9050
    volumes:
      - btcpay-{{SHOP_ID}}-data:/datadir
      - nbxplorer-{{SHOP_ID}}-data:/root/.nbxplorer
    depends_on:
      - postgres-{{SHOP_ID}}
      - nbxplorer-{{SHOP_ID}}

  # NBXplorer for blockchain indexing
  nbxplorer-{{SHOP_ID}}:
    image: nicolasdorier/nbxplorer:{{NBXPLORER_VERSION}}
    container_name: nbxplorer-{{SHOP_ID}}
    restart: unless-stopped
    networks:
      - shop-{{SHOP_ID}}-network
    environment:
      NBXPLORER_BIND: 0.0.0.0
      NBXPLORER_CHAINS: {{CRYPTO_CHAINS}}
      NBXPLORER_SIGNALFILELISTEN: 1
      NBXPLORER_{{PRIMARY_CRYPTO}}_RPCURL: {{RPC_URL}}
      NBXPLORER_{{PRIMARY_CRYPTO}}_NODEENDPOINT: {{NODE_ENDPOINT}}
    volumes:
      - nbxplorer-{{SHOP_ID}}-data:/datadir
      - bitcoin-data:/root/.bitcoin:ro

  # PostgreSQL for BTCPay
  postgres-{{SHOP_ID}}:
    image: postgres:15-alpine
    container_name: postgres-{{SHOP_ID}}
    restart: unless-stopped
    networks:
      - shop-{{SHOP_ID}}-network
    environment:
      POSTGRES_DB: btcpayserver
      POSTGRES_USER: btcpay
      POSTGRES_PASSWORD: {{DB_PASSWORD}}
    volumes:
      - postgres-{{SHOP_ID}}-data:/var/lib/postgresql/data

  # Nginx reverse proxy
  nginx-{{SHOP_ID}}:
    image: nginx:alpine
    container_name: nginx-{{SHOP_ID}}
    restart: unless-stopped
    networks:
      - shop-{{SHOP_ID}}-network
    volumes:
      - ./nginx/shop-{{SHOP_ID}}.conf:/etc/nginx/conf.d/default.conf:ro
      - shop-{{SHOP_ID}}-www:/var/www/html:ro
      - letsencrypt-{{SHOP_ID}}:/etc/letsencrypt:ro
    depends_on:
      - btcpay-{{SHOP_ID}}

  # Shop application (can be customized per shop)
  shop-app-{{SHOP_ID}}:
    image: zkm/shop-base:latest
    container_name: shop-app-{{SHOP_ID}}
    restart: unless-stopped
    networks:
      - shop-{{SHOP_ID}}-network
    environment:
      SHOP_ID: {{SHOP_ID}}
      BTCPAY_URL: http://btcpay-{{SHOP_ID}}:3003
      DATABASE_URL: postgresql://shop:{{SHOP_DB_PASSWORD}}@postgres-{{SHOP_ID}}:5432/shop
      REDIS_URL: redis://:{{REDIS_PASSWORD}}@redis-{{SHOP_ID}}:6379
      ENCRYPTION_KEY: {{SHOP_ENCRYPTION_KEY}}
    volumes:
      - shop-{{SHOP_ID}}-data:/app/data
      - shop-{{SHOP_ID}}-uploads:/app/uploads
    depends_on:
      - postgres-{{SHOP_ID}}
      - redis-{{SHOP_ID}}
      - btcpay-{{SHOP_ID}}

  # Redis for shop caching
  redis-{{SHOP_ID}}:
    image: redis:7-alpine
    container_name: redis-{{SHOP_ID}}
    restart: unless-stopped
    networks:
      - shop-{{SHOP_ID}}-network
    command: >
      redis-server
      --requirepass {{REDIS_PASSWORD}}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-{{SHOP_ID}}-data:/data

  # Lightning Network Daemon (optional)
  {{#IF_LIGHTNING}}
  lnd-{{SHOP_ID}}:
    image: lightninglabs/lnd:{{LND_VERSION}}
    container_name: lnd-{{SHOP_ID}}
    restart: unless-stopped
    networks:
      - shop-{{SHOP_ID}}-network
    environment:
      LND_CHAIN: {{PRIMARY_CRYPTO}}
      LND_ENVIRONMENT: {{NETWORK}}
    volumes:
      - lnd-{{SHOP_ID}}-data:/data
      - bitcoin-data:/root/.bitcoin:ro
    command: >
      lnd
      --bitcoin.active
      --bitcoin.{{NETWORK}}
      --bitcoin.node=bitcoind
      --bitcoind.rpchost={{RPC_HOST}}
      --bitcoind.rpcuser={{RPC_USER}}
      --bitcoind.rpcpass={{RPC_PASS}}
      --bitcoind.zmqpubrawblock={{ZMQ_BLOCK}}
      --bitcoind.zmqpubrawtx={{ZMQ_TX}}
      --tlsextradomain={{SHOP_ID}}.{{ONION_DOMAIN}}
      --alias={{SHOP_ALIAS}}
      --color={{SHOP_COLOR}}
  {{/IF_LIGHTNING}}

networks:
  shop-{{SHOP_ID}}-network:
    driver: bridge
    ipam:
      config:
        - subnet: {{SUBNET}}

volumes:
  tor-{{SHOP_ID}}-data:
  btcpay-{{SHOP_ID}}-data:
  nbxplorer-{{SHOP_ID}}-data:
  postgres-{{SHOP_ID}}-data:
  shop-{{SHOP_ID}}-data:
  shop-{{SHOP_ID}}-www:
  shop-{{SHOP_ID}}-uploads:
  redis-{{SHOP_ID}}-data:
  letsencrypt-{{SHOP_ID}}:
  {{#IF_LIGHTNING}}
  lnd-{{SHOP_ID}}-data:
  {{/IF_LIGHTNING}}
  
  # Shared bitcoin data (read-only)
  bitcoin-data:
    external: true
    name: zkm_bitcoin_data